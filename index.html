    function init() {
        const grid = document.getElementById('main-grid');
        const select = document.getElementById('region-select');
        select.innerHTML = '<option value="" disabled selected>Выберите Регион</option>';
        
        Object.keys(provinces).forEach(key => {
            const p = provinces[key];
            grid.innerHTML += `
                <div class="card ${p.size}" onclick="openPop('${key}')">
                    <img src="${p.img}" alt="${p.title}">
                    <div class="card-content">
                        <p style="font-size: 0.7rem; color: var(--accent); letter-spacing: 2px;">${p.sub}</p>
                        <h3>${p.title}</h3>
                    </div>
                </div>`;
            select.innerHTML += `<option value="${p.title}">${p.title}</option>`;
        });
    }

    function openPop(id) {

            </div>
            <div class="sight-grid">
                ${p.sights.map(s => `
                    <div class="sight-card">
                        <img src="${s.p}" alt="${s.n}">
                        <div class="sight-card-info">
                            <h4 style="font-size: 1.5rem; margin-bottom: 10px;">${s.n}</h4>
                            <p style="opacity:0.6; font-size:0.95rem; line-height: 1.4;">${s.d}</p>
                        </div>
                        <a href="${s.g}" target="_blank" class="map-btn">📍 СМОТРЕТЬ НА КАРТЕ</a>
                    </div>`).join('')}
            </div>`;
        document.getElementById('overlay').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closePop() {
        document.getElementById('overlay').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
        cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    });

    window.onload = init;
    </script>

    </body>
    </html>
